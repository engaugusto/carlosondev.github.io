{{ define "main" }}
  <div class="hx:mx-auto hx:flex hextra-max-page-width">
    {{ partial "sidebar.html" (dict "context" . "disableSidebar" true) }}
    <article class="cod-page">
      <main id="content" class="cod-shell">
        <header class="cod-listing-header">
          <div>
            <h1>{{ .Title }}</h1>
            <p class="cod-muted">{{ T "tagsIntro" }}</p>
          </div>
        </header>
        <div class="cod-taxonomy-grid">
          {{ range .Data.Terms.ByCount }}
            <a href="{{ .Page.RelPermalink }}" class="cod-taxonomy-item">
              <span>#{{ .Page.Data.Term }}</span><small>{{ .Count }}</small>
            </a>
          {{ end }}
        </div>
      </main>
    </article>
  </div>
{{ end }}
