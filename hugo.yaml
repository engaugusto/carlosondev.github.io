# Hugo configuration file
title: Carlos On Dev

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

outputs:
  home: [HTML,RSS]

languages:
  en:
    languageName: English
    weight: 1
    contentDir: content/en

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Contact ↗
      url: "https://github.com/engaugusto"
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    # - name: GitHub
    #   weight: 5
    #   url: "https://github.com/engaugusto"
    #   params:
    #     icon: github
    # - name: Twitter
    #   weight: 6
    #   url: "https://twitter.com/"
    #   params:
    #     icon: x-twitter

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
