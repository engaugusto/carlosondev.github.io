# carlosondev.com — Hugo + Hextra, modelled on akitaonrails.github.io
#
# Posts live in content/YYYY/MM/DD/<slug>/index.<lang>.md (one file per language).
# content/_index.<lang>.md and content/archives/_index.<lang>.md are GENERATED by
# `mise run index` (scripts/generate_index.py). Don't edit them by hand.

baseURL: "https://carlosondev.com/"
title: "Carlos on Dev"
enableEmoji: true
enableRobotsTXT: true

# Every language lives under its own prefix: /en/, /es/, /pt-br/.
# "/" is redirected by Netlify (netlify.toml) based on the browser language.
defaultContentLanguage: en
defaultContentLanguageInSubdir: true

# Fast dev preview: `hugo server --renderSegments recent`
segments:
  recent:
    includes:
      - kind: '{home,section,taxonomy,term}'
      - path: '{/2026/**,/2027/**,/about,/archives}'

languages:
  en:
    languageName: English
    languageCode: en-US
    weight: 1
    title: Carlos on Dev
    params:
      description: Carlos Augusto on AI, enterprise systems, security and building things.
    menus:
      main:
      - name: Theme
        weight: 0
        params:
          type: theme-toggle
      - name: About
        pageRef: /about
        weight: 1
      - name: Archives
        pageRef: /archives
        weight: 2
      - name: Tags
        pageRef: /tags
        weight: 3
      - name: Book a meeting
        url: https://calendar.app.google/Vd5hnDQdy3nfxEz87
        weight: 4
      - name: Search
        weight: 5
        params:
          type: search
      - name: RSS
        weight: 6
        url: /en/index.xml
        params:
          icon: rss
      - name: GitHub
        weight: 7
        url: https://github.com/engaugusto
        params:
          icon: github
      - name: Language
        weight: 8
        params:
          type: language-switch
  es:
    languageName: Español
    languageCode: es-ES
    weight: 2
    title: Carlos on Dev
    params:
      description: Carlos Augusto sobre IA, sistemas empresariales, seguridad y construir cosas.
    menus:
      main:
      - name: Tema
        weight: 0
        params:
          type: theme-toggle
      - name: Sobre mí
        pageRef: /about
        weight: 1
      - name: Archivo
        pageRef: /archives
        weight: 2
      - name: Etiquetas
        pageRef: /tags
        weight: 3
      - name: Reservar reunión
        url: https://calendar.app.google/Vd5hnDQdy3nfxEz87
        weight: 4
      - name: Buscar
        weight: 5
        params:
          type: search
      - name: RSS
        weight: 6
        url: /es/index.xml
        params:
          icon: rss
      - name: GitHub
        weight: 7
        url: https://github.com/engaugusto
        params:
          icon: github
      - name: Idioma
        weight: 8
        params:
          type: language-switch
  pt-br:
    languageName: Português
    languageCode: pt-BR
    weight: 3
    title: Carlos on Dev
    params:
      description: Carlos Augusto sobre IA, sistemas corporativos, segurança e construir coisas.
    menus:
      main:
      - name: Tema
        weight: 0
        params:
          type: theme-toggle
      - name: Sobre
        pageRef: /about
        weight: 1
      - name: Arquivo
        pageRef: /archives
        weight: 2
      - name: Tags
        pageRef: /tags
        weight: 3
      - name: Agendar reunião
        url: https://calendar.app.google/Vd5hnDQdy3nfxEz87
        weight: 4
      - name: Buscar
        weight: 5
        params:
          type: search
      - name: RSS
        weight: 6
        url: /pt-br/index.xml
        params:
          icon: rss
      - name: GitHub
        weight: 7
        url: https://github.com/engaugusto
        params:
          icon: github
      - name: Idioma
        weight: 8
        params:
          type: language-switch

taxonomies:
  tag: tags

outputs:
  home: [html, rss]
  page: [html]
  section: [html, rss]
  taxonomy: [html]
  term: [html, rss]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  rss:
    limit: 30

params:
  author:
    name: "Carlos Augusto"

  description: "Carlos Augusto on AI, enterprise systems, security and building things."

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: false   # it's in the navbar menu instead

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true

  dateFormat: ":date_long"
  displayUpdatedDate: false

  editURL:
    enable: false

  # FlexSearch is fine at this size. The library is vendored in assets/lib so
  # builds never depend on a CDN.
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
      js: lib/flexsearch.bundle.min.js

  highlight:
    copy:
      enable: true
      display: hover

  imageZoom:
    enable: true

  youtubeDefaults:
    iframeStyle: "border:0; width:100%; aspect-ratio:16/9;"

  # Home page: posts from January of (current year - 1) onward. Older -> /archives/.
  # Featured posts: set `featured: true` in a post's front matter.

  # Comments via Giscus (GitHub Discussions). Enable Discussions on the repo,
  # get the IDs at https://giscus.app, fill them in and set enable: true.
  comments:
    enable: false
    type: giscus
    giscus:
      repo: engaugusto/carlosondev.github.io
      repoId: ""
      category: Announcements
      categoryId: ""
      mapping: pathname
