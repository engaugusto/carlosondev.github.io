# Controlled tag vocabulary. One entry per canonical tag, with the name used in
# each language (it becomes the URL: /en/tags/<name>/, /es/tags/<name>/ ...).
#
#   mise run tags:search "query"   # look before you add
#   mise run tags:check            # validates every published post
#   mise run tags:catalog          # regenerates TAGGING.md
#
# Names: lowercase, ASCII, words joined by "-". kind: topic (default) | series | project
